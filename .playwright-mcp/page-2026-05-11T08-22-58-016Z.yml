    - heading "Erneuerung Wohnsiedlung Badenerstrasse, Zürich" [level=1] [ref=e49]
    - generic [ref=e51]:
      - generic [ref=e52]:
        - paragraph [ref=e53]:
          - text: Stadthaus an der Badenerstrasse mit Gewerbe und Wohnungen – mit Potenzial zur Weiterentwicklung
          - text: Projektwettbewerb 2025, 3. Preis
        - paragraph [ref=e54]
        - generic [ref=e55]:
          - paragraph [ref=e56]:
            - text: Urbanität durch qualitätvolle Dichte – Entlang der Badenerstrasse entsteht ein Stadthaus als Baustein einer sich verdichtenden Stadtlandschaft. Das Projekt markiert den Übergang zwischen bestehender Bebauung und zukünftiger Massstäblichkeit und versteht sich als präzise Weiterentwicklung im gewachsenen Kontext. Es reagiert auf steigende bauliche und soziale Dichte und stärkt den Strassenraum als urbanen Ort von Aufenthalt, Begegnung und Bewegung.
            - text: Das Erdgeschoss öffnet sich mit flexibel nutzbaren Gewerbeeinheiten und klar adressierten Eingängen zur Stadt. Erker und Rücksprünge strukturieren das Volumen und differenzieren die Fassade. Der bestehende Fussabdruck bleibt erhalten; die Architektur gewinnt dabei Eigenständigkeit und Qualität. Volumetrie und Fassadengliederung vermitteln zwischen den Nachbarbauten, eine klare Horizontlinie sichert Kontinuität im Stadtraum. Die Freiräume reagieren auf die erhöhte Dichte mit differenzierten Qualitäten. Zur Strasse entsteht eine klar gefasste Vorzone als Übergang zum öffentlichen Raum. Grosskronige Bäume verleihen Massstab und Tiefe. Im rückwärtigen Bereich entwickelt sich eine ruhige, waldartige Freiraumstruktur mit standortgerechter Bepflanzung, die ein angenehmes Mikroklima schafft. Terrassen, Höfe und Dachflächen ergänzen das Angebot an gemeinschaftlich nutzbaren Grünräumen. Das Gebäude bietet flexible, langfristig nutzbare Grundrisse für unterschiedliche Lebensmodelle. Die Wohnungen reagieren differenziert auf Stadt- und Gartenseite und schaffen ein ausgewogenes Verhältnis zwischen Offenheit und Rückzug. Gemeinschaftliche Bereiche – vom Eingang über die Treppenhäuser bis zu den Dachflächen – fördern Begegnung und Nachbarschaft.
            - text: Konstruktiv folgt das Haus einem klaren, robusten Prinzip. Ein effizientes Tragwerk ermöglicht wirtschaftliche Spannweiten, modulare Grundrisse und eine hohe Nutzungsvielfalt. Die Struktur ist auf Dauerhaftigkeit und Anpassungsfähigkeit ausgelegt und bildet die Grundlage für langfristige Mietverhältnisse und eine nachhaltige Bewirtschaftung. Kompakte Bauweise, gute Orientierung und eine leistungsfähige Gebäudehülle sichern einen hohen energetischen Standard bei minimalem technischem Aufwand. Der bewusste, zurückhaltende Einsatz langlebiger Materialien reduziert den Unterhaltsaufwand und schont Ressourcen über den gesamten Lebenszyklus. So entsteht ein dauerhaftes, identitätsstiftendes Stadthaus mit konstruktiver Klarheit und zurückhaltender Präsenz – ökologisch verantwortungsvoll und sozial verbindend.
