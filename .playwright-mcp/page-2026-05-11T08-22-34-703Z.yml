    - heading "Temporäres Hotel Lauchernalp, Lötschental" [level=1] [ref=e49]
    - generic [ref=e51]:
      - generic [ref=e52]:
        - paragraph [ref=e53]:
          - text: Temporäres Hotel Lauchernalp
          - text: Direktauftrag 2025
          - text: "Ausführung: August bis Dezember 2025"
          - text: Bergbahnstrasse 2
          - text: 3918 Wiler
        - paragraph [ref=e54]
        - generic [ref=e55]:
          - paragraph [ref=e56]:
            - text: "Ein Bergsturz im Frühjahr 2025 veränderte das Lötschental grundlegend. Neben Wohn- und Infrastrukturbauten traf es auch weite Teile des Gastgewerbes – rund zwei Drittel der Hotelbetten gingen verloren. Bereits im Sommer fiel der Entscheid für einen temporären Ersatzbau. So entstand bis Ende 2025 gegenüber der Bergstation Lauchernalp auf rund 2’000 m ü. M. innerhalb von nur drei Monaten ein dreigeschossiges Hotel in Holzelementbauweise, das noch im selben Jahr den Betrieb aufnahm. Grundlegend für die kurze Bauzeit war ein hoher Vorfertigungsgrad: Decken- und Wandelemente sowie vollständig ausgebaute Nasszellenmodule wurden im Werk vorgefertigt und auf der Baustelle montiert."
            - text: Der Zugang zum Haus erfolgt über eine vorgelagerte Sonnenterrasse, die die Erschliessung organisiert und direkt in den Ski- und Bikeraum führt. Von dort gelangt man in eine kleine Lounge mit integrierter Rezeption, die fliessend in den Aufenthaltsbereich übergeht. Das Hotel umfasst insgesamt 19 Zimmer für bis zu 64 Gäste, überwiegend in den beiden Obergeschossen angeordnet und talwärts orientiert. Jede Einheit verfügt über eine eigene Nasszelle sowie fest eingebaute Möbel. Klappbetten ermöglichen unterschiedliche Belegungen innerhalb der kompakten Grundrissstruktur. Die Balkone erweitern die Zimmer um einen geschützten Aussenraum mit Blick ins Tal und prägen als durchgehende Ebene zugleich die Südostfassade. Sie verleihen dem Volumen Tiefe, übernehmen den Sonnenschutz und vermitteln zwischen Innenraum und Landschaft.
            - text: Materialität und Farbigkeit sind regional verankert. Traditionelle Lötschentaler Wolldecken aus dem Lötschentaler Museum bildeten den Ausgangspunkt für das Farbkonzept des Bodens. Ihre Muster, Formen und kräftigen Grundfarben wurden aufgenommen und weiterentwickelt. Aus dieser Auseinandersetzung entstand auch eine eigens für das Hotel entworfene Wolldecke, die die charakteristischen Motive in eine zeitgenössische Gestaltung überführt. Die Decke ergänzt den konstruktiven Holzbau um eine weiche Ebene und fügt dem Raum als natürliches Material eine warme Textur hinzu. Ihre kräftigen Grundfarben wirken zeitlos und frisch zugleich. So bleibt der regionale Bezug auch im Detail ablesbar.
