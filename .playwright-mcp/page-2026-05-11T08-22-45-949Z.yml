    - heading "Bahnhofareal und Jugendherberge, Pontresina" [level=1] [ref=e49]
    - generic [ref=e51]:
      - generic [ref=e52]:
        - paragraph [ref=e53]:
          - text: Projektwettbewerb, 2. Preis
          - text: Neubau Jugendherberge mit 48 Zimmer und 160 Betten; Reorganisation Aufnahmegebäude Bahnhof Pontresina; Wohn- und Gewerbebauten
        - generic [ref=e54]:
          - paragraph [ref=e55]
          - paragraph [ref=e56]: Das Bahnhofsareal Nord in Pontresina soll mit einem Ersatzneubau der Jugendherberge und neuen Wohn- und Gewerbebauten reorganisiert und neu gestaltet werden. Als Teil des UNESCO-Weltkulturerbes Rhätische Bahn kommt dem Gebiet mit und um die historischen Bahnhofbauten eine wichtige baukulturelle Bedeutung zu. Unter Berücksichtigung denkmalpflegerischer Aspekte wird die Geschichte des Bahnhofsensembles weitergeschrieben. Die Jugendherberge befindet sich versetzt auf der gegenüberliegenden Seite zum Aufnahmegebäude hin und stärkt die Linearität des Städtebaus. Die Neubauten der RhB führen diese räumliche Struktur weiter.
          - paragraph [ref=e57]: Durch die Staffelung von gut proportionierten Gebäudestrukturen wird eine Folge von platzartigen Bereichen geschaffen, welche mit Belagsgestaltung und Baumreihen ergänzt wird. Mit der Reorganisation des Aufnahmegebäudes, sowie der Infrastruktur wird die Koexistenz von verschiedenen Verkehrsteilnehmenden gewährleistet und der Bahnhof Pontresina als wichtige Drehscheibe des öffentlichen Verkehrs, wie auch für Freizeit- und Naherholungsaktivitäten aktiviert. Die Grundstruktur des Aufnahmegebäudes wird auf den ursprünglichen Bestand zurückgesetzt und sanft saniert. Die Jugendherberge wird von zwei Seiten her erschlossen und bietet Platz für 160 Betten, eine Boulderhalle und ein Sportzentrum. Zwischen Ankunftsgebäude und Herberge spannt sich ein neuer Raum auf. Dieser Platz wird mitunter als Aussengastronomie der Herberge genutzt. Zudem befindet sich hier auch ein Info-Pavillon und ein Alpengarten. Die Terrasse entlang der bereits bestehenden Hangkante bietet Aussicht auf das gegenüberliegende Dorf mit Bergpanorama. Die Erweiterungsbauten an der Via da la Staziun basieren auf einer einfachen Grundstruktur und sind dadurch einer flexiblen Nutzung zuzuschreiben.
          - paragraph [ref=e58]: Bei den Hybridbauten werden alle erdberührenden Bauteile, sowie die aussteifenden Kerne aus Stahlbeton erstellt. Die restlichen Bauteile sind als Holzelementkonstruktion angedacht. Dies ermöglicht einen hohen Vorfertigungsgrad und führt zu einer ökonomischeren und schnelleren Erstellung. Diese Methodik lässt es zu, die Bauten von regionalen Unternehmungen erstellen zu lassen.
          - paragraph [ref=e59]
