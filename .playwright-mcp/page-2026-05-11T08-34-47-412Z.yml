            - heading "Zukunftstag 2025" [level=1] [ref=e176]
            - heading "Junge Gäste entdecken, wie Architektur entsteht" [level=2] [ref=e177]
          - paragraph
          - paragraph [ref=e178]: "Der Zukunftstag brachte dieses Jahr frischen Wind ins Büro: Zwölf neugierige Schülerinnen und Schüler tauchten am 13. November bei pool Architekten in die Welt des Planens, Zeichnens und Bauens ein."
          - paragraph [ref=e179]: "Mit vielen Fragen im Gepäck erkundete die Gruppe unser Büro, erhielt Einblicke in unterschiedliche Entwurfsmethoden und besuchte eine laufende Baustelle, wo Architektur direkt erlebbar wurde. In unserer Modellwerkstatt wartete zum Abschluss eine besondere Herausforderung: Gemeinsam entstand eine grosse, nur gesteckte Da-Vinci-Brücke aus Holz – sorgfältig gebaut und erstaunlich robust. Wir freuen uns über das Interesse und die Begeisterung unserer jungen Gäste."
          - paragraph [ref=e180]: Schön, wart ihr bei uns!
          - paragraph
        - img "Zukunftstag 2025" [ref=e182]
