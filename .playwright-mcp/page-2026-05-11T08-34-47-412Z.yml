            - heading "1. Preis «Erneuerung Stammsiedlung BBZ»" [level=1] [ref=e458]
            - heading "Gewonnener Studienauftrag mit S2L Landschaftsarchitektur" [level=2] [ref=e459]
          - paragraph [ref=e460]:
            - text: Wir freuen uns über den 1. Preis für den Studienauftrag «Erneuerung Stammsiedlung BBZ» in Zürich und bedanken uns bei unserem Team für die ausgezeichnete Zusammenarbeit!
            - text: "Die Stammsiedlung der Baugenossenschaft Brunnenhof Zürich (BBZ) wird seit rund 20 Jahren auf der Basis eines Masterplanes in Etappen erneuert. Etwa die Hälfte der grossen Siedlung ist inzwischen mit grossmassstäblichen Neubauten ersetzt. Aufgrund der Erfahrung aus diesem Vorgehen sowie genereller, neuer Schwerpunkte beim Bauen überdachte die Genossenschaft BBZ die eingeschlagene Richtung: Mit dem Studienauftrag zur Erneuerung der Stammsiedlung war ein nachhaltiges Vorgehen zur Erneuerung der Siedlung bezüglich Bestand, Verdichtung, sozialem Gefüge etc. gesucht."
            - text: Unser Beitrag setzt auf etappiertes Weiterbauen an der bestehenden Siedlungsstruktur mit Erhalt eines grossen Teils der Häuser und möglichst aller Bäume und grünen Freiräume. Entlang der Quartierverbindungen werden einzelne Häuser mit wesentlich grösseren, urbaneren Neubauten ersetzt. Dadurch wird die gesamte Siedlung auf das angestrebte Mass verdichtet. Ein Grossteil der bestehenden Häuser wird somit lediglich pinselsaniert oder im Grundriss leicht angepasst – die tiefen Mieten bleiben bestehen und somit auch die soziale Durchmischung der Mieterschaft. Um die vielen grossen Gehölze zu erhalten wird auf nicht überbaute Untergeschosse fast vollständig verzichtet.
            - link "Link zum Projekt «Erneuerung Stammsiedlung BBZ»" [ref=e461] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2024/0496-bbz.html&browse=browse
              - text: Link zum Projekt «Erneuerung Stammsiedlung BBZ»
            - link "(Nicht) alles wird neu – Link zur BBZ" [ref=e462] [cursor=pointer]:
              - /url: https://www.bgbrunnenhof.ch/siedlungen/brunnenpark/weitere-bauetappen/
              - text: (Nicht) alles wird neu – Link zur BBZ
        - img "1. Preis «Erneuerung Stammsiedlung BBZ»" [ref=e464]
