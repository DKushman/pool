          - paragraph [ref=e414]:
            - text: Am vergangenen Samstag, 31. August 2024, wurde der Architekturpreis Region Winterthur AW 24 vergeben. Die «Arealentwicklung Hobelwerk» wurde mit einer Anerkennung ausgezeichnet.
            - text: "Der Verein Architekturpreis Region Winterthur hat sich zum Ziel gesetzt, alle vier Jahre für Winterthur und die Region beispielhafte Leistungen im Bereich Architektur, Ingenieurwesen und Landschaftsarchitektur auszuzeichnen. In diesem Jahr wurde der Preis zum fünften Mal vergeben. Insgesamt 58 Werke hat die Jury beurteilt, 16 besichtigt. Im Vergleich zur letzten Ausgabe des Preises hat der Anteil an Umbauten, Umnutzungen, Sanierungen und Erweiterungen zugenommen: von 25 auf 40 Prozent."
            - text: Auf den Jurypreis folgt der Publikumspreis – für die fünf prämierten Projekte kann bis zum 20. September 2024 unter folgendem
            - link "Link" [ref=e415] [cursor=pointer]:
              - /url: https://www.landbote.ch/architekturpreis-in-winterthur-und-region-und-die-gewinner-heissen-220930086471
            - text: abgestimmt werden.
            - link "Zum Projekt Hobelwerk" [ref=e416] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2014/hobelwerk/#
              - text: Zum Projekt Hobelwerk
        - img "Architekturpreis Region Winterthur AW 24" [ref=e418]
      - article [ref=e420]:
        - generic [ref=e421]:
          - generic [ref=e422]:
            - time [ref=e423]: 30.08.2024
            - heading "Ausstellung im ZAZ Bellerive" [level=1] [ref=e424]
            - heading "Wettbewerbe Architektur und Landschaft vom 6.9. bis 8.12.2024" [level=2] [ref=e425]
          - paragraph
          - paragraph [ref=e426]:
            - text: Unsere Lebensräume befinden sich in stetigem Wandel. Wettbewerbe für Architektur und Landschaft sind dabei eines der wichtigsten Instrumente, die bauliche Entwicklung zu planen und voranzutreiben. Allein das Amt für Hochbauten Stadt Zürich und das Hochbauamt Kanton Zürich loben jedes Jahr etwa fünfzehn Wettbewerbe aus, dutzende weitere werden anderweitig veranstaltet. Doch von der Bekanntgabe des Gewinnerprojekts bis zu dessen Ausführung vergehen oft Jahre. So bleibt es schwer, Übersicht zu behalten, wie und wo sich unsere urbane Landschaft weiterentwickelt – für Architekt:innen wie auch für die Bevölkerung.
            - text: "Die Ausstellung zeigt daher eine Sammlung von erstplatzierten Projekten der letzten zwei Jahre – aus der Stadt Zürich und dem gesamten Kanton. Durch die 104 gesammelten Wettbewerbe entsteht eine Gegenüberstellung unterschiedlichster Bauten, Ansätze und Nutzungen. Die Schau regt zur Diskussion an: Über Stadtentwicklung und architektonische Haltungen, über Fragen der Nachhaltigkeit und des Weiterbauens – vor allem aber auch über die Wettbewerbspraxis, ihre Voraussetzungen und ihre Ergebnisse."
            - text: Die Ausstellung zeigt auch Beiträge von pool Architekten.
            - link "Link zum ZAZ Bellerive" [ref=e427] [cursor=pointer]:
              - /url: https://www.zaz-bellerive.ch/programm/
              - text: Link zum ZAZ Bellerive
          - link:
            - /url: https://www.poolarch.ch/loop/
          - paragraph
        - img "Ausstellung im ZAZ Bellerive" [ref=e429]
