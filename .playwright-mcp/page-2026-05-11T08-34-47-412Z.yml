            - heading "Eröffnung temporäres Hotel nach Bergsturz in Blatten" [level=1] [ref=e150]
            - heading "Neubau auf der Lauchernalp in Rekordzeit" [level=2] [ref=e151]
          - paragraph
          - paragraph [ref=e152]:
            - text: Gemeinsam mit Schäfer Holzbautechnik projektieren wir auf der Lauchernalp im Wallis ein temporäres Hotel. Hintergrund ist der Bergsturz, durch den im Lötschental rund zwei Drittel der bestehenden Hotelbetten verloren gingen.
            - text: Der dreigeschossige Holzelementbau bietet Platz für 19 Zimmer mit insgesamt 54 Betten. Dank der im Werk vorgefertigten Decken- und Wandelemente sowie der voll ausgestatteten Badezimmer-Module kann der Holzbau besonders effizient umgesetzt und innerhalb kürzester Zeit auf rund 2’000 Metern über Meer errichtet werden. Die Konstruktion aus Holzelementbauteilen ermöglicht einen problemlosen Rück- und Wiederaufbau an einem neuen Standort.
            - text: Das Hotel wurde in Rekordzeit geplant und errichtet. Ende Juli entstanden die ersten Entwürfe und nun wird es bereits am 19. Dezember pünktlich zur Eröffnung der Wintersaison 2025 in Betrieb genommen.
            - link:
              - /url: https://www.poolarch.ch/projekte/2025/0529-tempora%CC%88res-hotel-lauchernalp.html
