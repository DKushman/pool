            - heading "Detail Award 2024" [level=1] [ref=e359]
            - heading "Sonderpreis «Zirkuläres Bauen» für die Provisorische Sportbauten" [level=2] [ref=e360]
          - paragraph [ref=e361]:
            - text: Der Detail Award zählt zu den wichtigsten internationalen Auszeichnungen in der Architektur. Mit 527 Einreichungen aus 40 Ländern erlebte er in diesem Jahr eine Rekordbeteiligung. Neben den drei Hauptpreisen vergab die Jury einen Students‘ Award sowie einen Sonderpreis für Zirkuläres Bauen, den wir mit den Provisorischen Sportbauten gewinnen konnten. Wir freuen uns über diese internationale Auszeichnung!
            - text: "Jurystatement (Auszug):"
            - text: «Aufgrund der zunehmenden Rohstoffknappheit ist kreislauffähiges Planen und Bauen ein Gebot der Stunde und eines der zentralen Lernfelder für Planende in den nächsten Jahren und Jahrzehnten. (...) Einen wichtigen Schritt in dieser Entwicklung gehen Pool Architekten in Zürich mit ihren
            - link "provisorischen Sportbauten" [ref=e362] [cursor=pointer]:
              - /url: https://www.detail.de/de_de/provisorische-sportbauten
            - text: . Die temporären Hallen werden aus nachwachsenden Rohstoffen modular gebaut und sind mehrfach abbaubar und an neuen Standorten wieder neu aufbaubar. Durch diese Kombination aus seriellem, aber doch an den Ort anpassbarem Bauen zeigen Pool Architekten gemeinsam mit dem Kanton und der Stadt Zürich beispielhaft wie verantwortungsvolles zukunftsfähiges Bauen gelingen kann. Mit ihrer hohen Gestaltungsqualität und ihren konsequenten kreislauffähigen Lösungen weisen uns diese Projekte einen möglichen Weg in eine kreislauffähige Zukunft.»
            - text: Über die Website des
            - link "Detail Magazins" [ref=e363] [cursor=pointer]:
              - /url: https://www.detail.de/detailaward-2024#winner
            - text: sowie in der aktuellen Print-Ausgabe sind die ausgezeichneten Projekte und weitere Informationen zum Award zu finden.
