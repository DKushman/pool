            - heading "CCP15Y – 15 Years of Comparative Architectures" [level=1] [ref=e64]
            - heading "Die temporären Sportbauten als Teil der Wanderausstellung" [level=2] [ref=e65]
          - paragraph [ref=e66]: Das Cities Connection Project (CCP), 2012 von Nicola Regusci und Xavier Bustos gegründet, vernetzt europäische Städte und Regionen mit gemeinsamer architektonischer Tradition und richtet den Blick auf zeitgenössische Architektur und Stadtentwicklung.
          - paragraph [ref=e67]
          - paragraph [ref=e68]: Anlässlich des 15-jährigen Bestehens zeigt CCP die Ausstellung CCP15Y – 15 Years of Comparative Architectures. Die temporären Sportbauten wurden für die Teilnahme ausgewählt und als Beispiel für öffentliche Infrastrukturprojekte in den Kontext aufgenommen. Die Ausstellung wurde am 16. April 2026 in Barcelona eröffnet und reist anschliessend durch weitere europäische Städte. Sie vereint Beiträge aus 15 Jahren CCP und präsentiert Projekte von über 400 Architekturbüros. Im Fokus steht die Rolle öffentlicher Bauten für die Stadtentwicklung.
