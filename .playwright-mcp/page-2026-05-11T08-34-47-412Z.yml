            - heading "Nutzungskonzept Bahnhofgebiet Biel" [level=1] [ref=e505]
            - heading "Ergebnisse der Testplanung in Biel ausgestellt" [level=2] [ref=e506]
          - paragraph [ref=e507]:
            - text: Die Ansprüche an das Bieler Bahnhofgebiet sind im Wandel. Um sicherzustellen, dass das Bahnhofgebiet auch in Zukunft ein attraktives Zentrum und eine funktionierende multimodale Mobilitätsdrehscheibe für die gesamte Region ist, will die Stadt Biel nun gemeinsam mit der Bevölkerung und den Betroffenen ein Nutzungskonzept erarbeiten. Das Konzept wird in mehreren Phasen mittels Testplanung und partizipativen Verfahrens entwickelt.
            - text: Drei interdisziplinär zusammengesetzte Teams erarbeiteten im Rahmen der Testplanung unterschiedliche Entwürfe wie das Bahnhofgebiet weiterzuentwickeln und zu organisieren ist. Ziel der Testplanung war die fundierte Analyse und darauf aufbauend das Durchspielen unterschiedlicher Lösungsansätze (Nutzungsszenarien) für ein Nutzungskonzept, das gleichwohl die städtebaulichen, sozial- und freiräumlichen sowie verkehrlichen Elemente für die Weiterentwicklung des Gebiets enthält.
            - text: Die Schlussabgaben werden zusammen mit den Erkenntnissen für das Nutzungskonzept öffentlich ausgestellt.
            - text: Ausstellung vom 13. bis 21. Juni 2024
            - text: "Ort: Nebia (Foyer), Thomas-Wyttenbach-Strasse 4, 2502 Biel"
            - text: "Öffnungszeiten:"
            - text: Montag–Donnerstag, 16.30 bis 18.30 Uhr
            - text: Freitag, 12 bis 14 Uhr
            - text: Samstag, 15. Juni von 10 bis 12 Uhr
        - img "Nutzungskonzept Bahnhofgebiet Biel" [ref=e509]
