            - heading "Update Ziegelei Ost Allschwil" [level=1] [ref=e166]
          - paragraph
          - text: Das Quartierplanverfahren für das Areal Ziegelei Ost in Allschwil befindet sich nach wie vor in Bearbeitung. Momentan wird unter anderem der Mitwirkungsbericht ausgearbeitet.
          - text: Gleichzeitig dazu wird das Gebiet in verschiedenen Hochschulformaten untersucht. Die Hochschule Biberach aus Baden-Württemberg bearbeitet das Ziegelei-Areal im Rahmen eines laufenden Entwurfsateliers. Nach einem ersten Besuch im Oktober 2025 analysieren die Studierenden die bestehenden Strukturen und Freiräume und entwickeln darauf aufbauend Szenarien für ein aus dem Bestand weitergedachtes, gemischt genutztes Quartier mit Wohnen, Gewerbe, sozialer Infrastruktur und vielfältigen öffentlichen Räumen.
          - text: Ab dem Frühlingssemester 2026 setzt sich auch die FHNW vertieft mit dem Areal auseinander. Das geplante Entwurfsatelier ist Teil des übergeordneten Jahresthemas «Transformation» und bildet zugleich eine Schnittstelle zum unter pool-Beteiligung laufenden BFE-Forschungsprojekt zur Wiederverwendung von gemauerten Wandstücken als Module («ReWaMo»). pool unterstützt die Arbeiten mit diversen Inputs sowie Zwischen- und Schlusskritiken.
          - paragraph [ref=e167]:
            - link:
              - /url: https://www.poolarch.ch/projekte/2022/0474-bricks-allschwil.html
            - link "Zum Projekt" [ref=e168] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2022/0474-bricks-allschwil.html
          - paragraph
