            - heading "Der fertige Alto Tower" [level=1] [ref=e121]
          - paragraph [ref=e122]:
            - text: An der Freihofstrasse steht der fertiggestellte Alto Tower – abgerüstet und bereit für den Einzug. Mit 26 Geschossen und 149 Wohnungen setzt das neue Wohnhochhaus einen markanten Akzent in Zürich-Altstetten und knüpft dabei an den Bestand der ehemaligen Fiat-Garage an.
            - text: Als erstes Hochhaus der Stadt mit integrierter Photovoltaikfassade verbindet der Turm Energiegewinnung und Architektur nahtlos – eine schlanke, ressourcenschonende Betonkonstruktion bildet dafür die Grundlage. Gleichzeitig entsteht am Sockel des Gebäudes eine öffentliche Stadtloggia als gedeckter Raum und Bindeglied zwischen Neubau und Bestand.
