            - text: Wir freuen uns über den Zuschlag für die Instandsetzung der Zeughäuser auf dem Kasernenareal in Zürich. Die 1846–1876 erbaute Kasernenanlage gehört zu den bedeutendsten Bauwerken des Historismus in der Schweiz. Das Areal soll gemäss Masterplan «Zukunft Kasernenareal Zürich» etappenweise neuen Nutzungen zugeführt werden. Wir bedanken uns bei unserem Generalplanungsteam für den grossen Einsatz und freuen uns auf die kommende Aufgabe!
