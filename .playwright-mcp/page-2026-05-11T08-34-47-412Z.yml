          - paragraph [ref=e526]:
            - text: Für den Projektwettbewerb „Engimatt” waren fünf Teams eingeladen, den bestehenden Genius Loci des Areals in Zürich-Enge weiter zu entwickeln und das bestehende Hotel Engimatt durch einen zeitgemässen Wohnungsbau zu ersetzen.
            - text: Wir haben einen kompakten, leichten Holzbau vorgeschlagen, der auf dem bestehenden Untergeschoss fusst und den üppigen Baumbestand erhält. Herzstück unseres Entwurfs ist eine grosse, einladende Lobby, die wie in einem Grandhotel, spontane Begegnungen der Bewohner:innen ermöglicht.
