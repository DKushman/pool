            - heading "Am 9. Mai ist pool an der ZHAW mit mehreren Projekten vertreten" [level=2] [ref=e38]
          - paragraph [ref=e39]: "Am 9. Mai 2026 findet im Blauen Saal der Halle 180 der ZHAW Winterthur das Symposium «Architektur und Handwerk: Eine Wiederannäherung?» im Rahmen des Forschungsprojekts Walz 4.0 statt. Im Zentrum steht die Frage, wie Architektur und Handwerk in der Praxis enger zusammenwirken können – heute und in Zukunft."
          - paragraph [ref=e40]
          - paragraph [ref=e41]: "Wir beteiligen uns mit mehreren Beiträgen am Symposium: Thomas Friberg gibt Einblick in die Arbeit an den temporären Sportbauten. Christoph Stahel stellt gemeinsam mit Erich Mühlemann von Schäfer Holzbautechnik das Temporäre Hotel Lauchernalp sowie El Gato Muerto vor. Die Beiträge greifen Fragen zum Zusammenspiel von Planung und Ausführung sowie zur Zusammenarbeit im Bauprozess auf. Das Symposium wird unter anderem von Andreas Sonderegger mitorganisiert. Neben den Vorträgen bietet das Programm auch Workshops, Diskussionsrunden sowie eine Führung durch die Werkstückhalle mit Einblicken in 1:1 Mock-ups."
