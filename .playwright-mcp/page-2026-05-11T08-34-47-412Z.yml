            - time [ref=e445]: 28.08.2024
            - heading "Re-Use Pavillon für Schulareal" [level=1] [ref=e446]
            - heading "Aussenraum-Pavillon aus bestehendem Pausendach konstruiert" [level=2] [ref=e447]
          - paragraph [ref=e448]:
            - text: "Zu Beginn des Schuljahres wurde der Re-Use-Pavillon auf dem Schulareal Hans Asper/Im Lee in Betrieb genommen. Wir haben ihn am Mittwoch besichtigt. Das Projekt wurde von Schäfer Holzbau, Makiol Widerkehr, Grünenfelder Gartenbau und pool realisiert. Besonders: Unterstützt wurde der Aufbau von unseren Praktikant:innen Moritz, Sarina, Iben, Joan, Justus, Doreen und Fabio! Vielen Dank für euren Einsatz!"
            - text: Die Schule Hans Asper/Im Lee hat nach einer Provisorischen Sporthalle weiteren Bedarf für einen kleinen Pavillon angemeldet. pool gab den Anstoss einen rund 40 m² grossen Pavillon aus dem bestehenden Pausendach der Schule Saatlen zu konstruieren. Entwurf und Umsetzung wurden vom pool-Ressort Innovation & Forschung begleitet.
            - text: Zentrale Fragen waren «Wie kann die bestehende Pausendachstruktur an die neuen geometrischen Gegebenheiten des neuen Standorts angepasst werden? Wie können möglichst viele der vorhandenen Bauelemente genutzt werden, um Abfall und die Notwendigkeit neuer Materialien zu minimieren?» Es standen 16 Doppelstützen, 4 Sitzbänke, 16 Konsolen, 10 Pfetten, 50 Sparren und 40 m² Pflastersteine zur Verfügung. Diese Elemente bilden die Basis des neuen Pavillons. Projektierung und Entwurf erfolgte von März bis Juni 2024, die Umsetzung während der Sommerferien von Mitte Juli bis Mitte August.
            - link:
              - /url: https://www.poolarch.ch/projekte/2024/0499-pausendach-hans-asper.html&refPage=Werkverzeichnis
            - link "Zum Projekt" [ref=e449] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2024/0499-pausendach-hans-asper.html&refPage=Werkverzeichnis
            - emphasis [ref=e450]: "Foto: Ralph Feiner"
        - img "Re-Use Pavillon für Schulareal" [ref=e452]
