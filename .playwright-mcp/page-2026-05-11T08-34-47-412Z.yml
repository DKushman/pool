            - heading "Update aus Einsiedeln" [level=1] [ref=e188]
            - heading "Die drei Teilprojekte des «Einsiedlerhofs» werden in den kommenden Monaten gestaffelt fertiggestellt" [level=2] [ref=e189]
          - paragraph [ref=e190]:
            - text: Das Ensemble «Einsiedlerhof», bestehend aus einem Pfarreiheim für die römisch-katholische Kirchengemeinde, dem neuen Verwaltungsbau für den Bezirk Einsiedeln und zwei Wohnhäusern mit insgesamt 25 Eigentumswohnungen, nimmt Form an.
            - text: "Die drei Teilprojekte mit unterschiedlichen Bauträgern, Nutzungen und Konstruktionsweisen werden in den kommenden Monaten gestaffelt fertiggestellt und bezogen: Während sich beim Pfarreiheim die Ausbauarbeiten im Abschluss befinden, werden die Fassaden der Wohnhäuser mit horizontaler Brettschalung eingekleidet und die Walmdächer vollflächig mit PV eingedeckt. Beim Verwaltungsbau werden aktuell die Stirnfassaden und Brüstungen mit KS-Steinen gemauert und anschliessend geschlämmt."
            - link "Zum Projekt" [ref=e191] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2020/0412-einsiedlerhof/
              - text: Zum Projekt
