          - paragraph [ref=e201]:
            - text: "Am Mittwoch, 5. November findet im Rahmen der Ausstellung «Auszeichnung für gute Bauten der Stadt Zürich 2021 – 2024» eine Podiumsdiskusssion statt: Netto-Null, Verdichtung, Bestandeserhalt – neue Herausforderungen machen das Bauen in der Stadt komplexer. Ein Gespräch darüber, was es für das gute Bauen mit dem Bestand in Zukunft braucht."
            - text: "Diskussion mit: Marianne Baumgartner, Camponovo Baumgartner; Katrin Gügler, Direktorin Amt für Städtebau; David Leuthold, pool Architekten; Markus Siemienik, Leiter Anlageobjekte Ost, SBB Immobilien Development"
