            - heading "Öffentliche Einladung für Samstag, 21. Februar 2026" [level=2] [ref=e134]
          - paragraph [ref=e135]: Das Bauvorhaben Einsiedlerhof in Einsiedeln ist vollendet! Am 21. Februar, laden wir von 13 bis 17 Uhr ein, die Anlage vor Ort zu entdecken und Einblick in die unterschiedlichen Einheiten zu erhalten. Zur Besichtigung stehen das Pfarreiheim sowie das Bezirksgebäude offen.
          - paragraph [ref=e136]
          - paragraph
          - paragraph [ref=e137]: Treffpunkt ist das Foyer des Bezirksgebäudes im Erdgeschoss am Klosterplatz. Der Apéro findet auf der Terrasse im 4. Obergeschoss des Bezirksgebäudes statt. Wir empfehlen die Anreise mit dem öffentlichen Verkehr. Parkmöglichkeiten befinden sich beim Klosterplatz sowie im Parkhaus Brüel.
