            - time [ref=e370]: 21.10.2024
            - heading "2. Preis Konversion Sindelfinger Krankenhausareal" [level=1] [ref=e371]
            - heading "Städtebaulicher Realisierungswettbewerb im Rahmen der IBA’27" [level=2] [ref=e372]
          - paragraph [ref=e373]:
            - text: 2017 gestartet, arbeitet die IBA’27 gemeinsam mit Verwaltungen, Investoren, Fachleuten und den Menschen vor Ort an der Umsetzung kluger und mutiger Bauprojekte. Hundert Jahre nach der weltweit beachteten Architekturschau am Stuttgarter Weissenhof möchte die Internationale Bauausstellung zeigen, wie das Zusammenleben, Wohnen und Arbeiten in der Region Stuttgart zukünftig funktionieren kann.
            - text: 2023 wurde dazu ein städtebaulicher und freiraumplanerischer Realisierungswettbewerb zur Konversion des Sindelfinger Krankenhausareals in zwei Phasen durchgeführt. In der ersten Phase reichten in einem offenen Skizzenauswahlverfahren 36 nationale und internationale Architekturbüros ihre Entwürfe ein, wovon 15 Planungsbüros in die zweite Phase übergingen. pool hat zusammen mit Forward, Zirkular, Westpol und Claudia Nitsche den 2. Preis gewonnen!
            - text: "Andreas Hofer, Intendant der Internationalen Bauausstellung 2027 StadtRegion Stuttgart (IBA’27) ergänzt die Rückmeldung der Jury: «In allen Beiträgen war deutlich erkennbar: Wir befinden uns mitten in der Bauwende – alle Entwürfe setzten sich intensiv mit dem Erhalt von Bestandsgebäuden, Kreislaufwirtschaft, effizienter Ressourcennutzung sowie neuen Wohnformen in Kombination mit öffentlichen und gewerblichen Nutzungen auseinander. Es gab ein sehr breites Spektrum an Vorschlägen. Die IBA steht für experimentelle Ansätze. Die Entscheidung der Jury für diesen soliden Entwurf tragen wir mit und wünschen allen Beteiligten großen Mut bei der weiteren Umsetzung.»"
            - emphasis [ref=e374]:
              - link "Link zur Website IBA 27" [ref=e375] [cursor=pointer]:
                - /url: https://www.iba27.de/wettbewerb-zum-sindelfinger-krankenhausareal-entschieden/
            - text: Auf dem Gebiet des Sindelfinger Krankenhausareals soll nach Umzug des Krankenhausbetriebs ein neues lebendiges Stadtquartier geschaffen werden, das Wohnen, Arbeiten, Bildung und Freizeit auf eine innovative Weise miteinander verbindet und einen Beitrag zum sozialen Zusammenhalt der Stadt leistet. Klimaschutz und Nachhaltigkeit sollen bei der Umnutzung und Neubebauung und im künftigen Quartiersleben eine zentrale Rolle spielen.
            - text: Wir bedanken uns bei unserem Team mit
            - link "Forward Planung und Forschung" [ref=e376] [cursor=pointer]:
              - /url: https://forward.berlin/
            - text: ","
            - link "Zirkular" [ref=e377] [cursor=pointer]:
              - /url: https://zirkular.net/de/
            - text: ","
            - link "Westpol Landschaftsarchitektur" [ref=e378] [cursor=pointer]:
              - /url: https://westpol.ch/
            - text: und Claudia Nitsche!
            - link "Zum Projekt" [ref=e379] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2024/0498-sindelfingen.html
        - img "2. Preis Konversion Sindelfinger Krankenhausareal" [ref=e381]
