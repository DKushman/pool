            - heading "2. Preis «déjà-vu»" [level=1] [ref=e83]
            - heading "Projektwettbewerb Schürgistrasse" [level=2] [ref=e84]
          - paragraph [ref=e85]: Ausgehend von der Fragestellung „Wie geht bezahlbarer und ressourcenschonender Ersatzneubau heute?“ wurde der mit dem 2. Platz ausgezeichnete Projektvorschlag für die Schürgistrasse 62 als ruhiges, präzises Haus für Schwamendingen konzipiert, das sich in die Körnung und Typologie des Quartiers einfügt. Die kompakte Hausform mit Schrägdach, Erkern und Balkonen verleiht dem Gebäude eine klare Identität und Verankerung im Ort. Eine einfache, robuste Gebäudestruktur aus materialoptimiertem Holzbau mit hohem Wiederholungsgrad, minimaler Technik und Wiederverwendung von Bauteilen bildet die Grundlage für Kosteneffizienz und langfristige Nachhaltigkeit. Ergänzt wird dies durch suffiziente Grundrisse für rund 100 Bewohnende sowie eine aktivierte Boden- und Dachebene, die an das Erbe der Riedlandschaft anknüpft.
          - paragraph [ref=e86]
          - paragraph [ref=e87]: So erreicht der Ersatzneubau eine Nachhaltigkeit, die jener einer Bestandserweiterung ebenbürtig ist, und schafft langfristig einen sozialen, ökologischen und ökonomischen Mehrwert für Schwamendingen.
