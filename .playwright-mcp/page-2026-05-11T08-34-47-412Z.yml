          - paragraph [ref=e212]: Wir freuen uns über die Auszeichnung für Gute Bauten der Stadt Zürich, mit der unsere Sportbauten im städtischen Kontext gewürdigt wurden. Die Anerkennung unterstreicht die Bedeutung einer qualitätsvollen, nachhaltigen und sorgfältig in den Stadtraum eingebetteten Architektur. Unser Dank gilt der Jury für die Anerkennung sowie allen Beteiligten, die mit grossem Engagement zur Realisierung beigetragen haben.
