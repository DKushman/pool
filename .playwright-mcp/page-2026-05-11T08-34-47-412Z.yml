            - heading "1. Preis «Einbau Schulschwimmanlage Kesselhaus Letten»" [level=1] [ref=e302]
            - heading "pool baut einen Pool!" [level=2] [ref=e303]
          - paragraph [ref=e304]:
            - text: Wir freuen uns über den 1. Preis im Projektwettbewerb «Einbau Schulschwimmanlage Kesselhaus Letten» in Zürich-Wipkingen und natürlich auf die besondere Aufgabe das kulturhistorische Kesselhaus am Letten instandsetzen und durch unseren ersten gebauten «pool» zu ergänzen.
            - text: Um den Bedarf an Wasserflächen für den obligatorischen Schwimmunterricht im Schulkreis Waidberg zu decken, soll im ehemaligen Kesselhaus des Elektrizitätswerks der Stadt Zürich eine Schulschwimmanlage eingebaut werden. Die Liegenschaft liegt rechtsufrig an der Limmat und ist im Inventar der kunst- und kulturhistorischen Schutzobjekte von kommunaler Bedeutung aufgeführt.
            - text: Die Gesamtanlage ist ein wichtiger Zeuge der industriellen Vergangenheit des Quartiers. Unser Entwurf für das Kesselhaus erhält die Authentizität im städtischen Gefüge und macht die Geschichte des Bestands mit seinen im Laufe der Jahrzehnte gewonnen Altersspuren erfahrbar. Ziel des Projektvorschlages ist es, Kesselhaus und Annexbau integral zu erhalten und ihre bestehenden räumlichen sowie atmosphärischen Qualitäten durch die geplante Nutzung als Schulschwimmanlage unmittelbar erlebbar zu machen. Der industrielle Charakter des Innenraums soll weitgehend erhalten bleiben, wie auch die Spuren seiner Geschichte. Aussen werden die historisch bedeutenden Gebäude, wo notwendig, sorgfältig instandgesetzt, um ihre Integrität zu bewahren.
            - link "Zum Projekt" [ref=e305] [cursor=pointer]:
              - /url: https://www.poolarch.ch/projekte/2025/0502-schulschwimmanlage-kesselhaus.html&browse=browse
        - img "1. Preis «Einbau Schulschwimmanlage Kesselhaus Letten»" [ref=e307]
