            - time [ref=e224]: 03.10.2024
            - heading "Architekturpreis Kanton Zürich" [level=1] [ref=e225]
            - heading "Auszeichnung guter Bauten im Kanton Zürich erhalten" [level=2] [ref=e226]
          - paragraph
          - paragraph [ref=e227]: Mit Freude nehmen wir den Architekturpreis der Stiftung für die Auszeichnung guter Bauten im Kanton Zürich für unsere provisorischen Sportbauten entgegen. Die Würdigung bestätigt unseren Ansatz, auch temporäre Bauten mit hoher architektonischer Qualität und in konsequenter Holzbauweise zu realisieren. Unser Dank gilt der Jury für die Anerkennung sowie unseren engagierten Planungsteams und Unternehmenden, mit denen wir dieses modulare und wiederverwendbare Baukonzept erfolgreich entwickeln und umsetzen durften.
