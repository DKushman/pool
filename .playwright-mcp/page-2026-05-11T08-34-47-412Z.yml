            - heading "3. Preis «Urbanität durch qualitätvolle Dichte»" [level=1] [ref=e106]
            - heading "Erneuerung Wohnsiedlung Badenerstrasse – Projektwettbewerb" [level=2] [ref=e107]
          - paragraph [ref=e108]: Entlang der Badenerstrasse entwickelten wir ein Stadthaus, das zwischen bestehender Bebauung und zukünftiger Massstäblichkeit vermittelt. Der Entwurf entstand im Rahmen eines Wettbewerbs und versteht sich als Baustein einer sich verdichtenden Stadtlandschaft. Er stärkt den Strassenraum als urbanen Ort für Aufenthalt, Begegnung und Bewegung.
          - paragraph [ref=e109]
          - paragraph [ref=e110]: Flexible Gewerbeflächen im Erdgeschoss, differenzierte Freiräume mit waldartigem Charakter im Hof sowie gemeinschaftlich nutzbare Dachflächen schaffen vielfältige Qualitäten auf kompakter Fläche. Modulare Grundrisse und ein robustes Tragwerk ermöglichen langfristige Nutzbarkeit und eine nachhaltige Bewirtschaftung – ein präziser Beitrag im gewachsenen Kontext.
