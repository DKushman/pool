        - generic [ref=e89]:
          - img "portrait" [ref=e90]
          - paragraph [ref=e91]
          - paragraph [ref=e93]:
            - text: pool hat sich 1998 aus einer Diskussionsplattform gegründet. Wir pflegen bis heute eine Kultur des Dialogs und der Debatte, aktuell geleitet von 11 Partner:innen und 9 Associates. 2024 sind wir ein interdisziplinäres Team aus rund 100 Architekt:innen und Stadtplaner:innen. Unsere Projekte beinhalten die Themen Wohnen, Bildung, Kultur, Sport und Infrastruktur, Nachhaltigkeit und Bauen im Bestand sowie Städtebauliche Planungen.
            - text: Wir setzen uns massstabsübergreifend mit den drängenden Fragen der Klimaveränderung, Ressourcenknappheit und Verdichtung auseinander. Dabei wird auch unsere Büro- und Arbeitsform als «work in progress» verstanden, um sich dem ständig verändernden Berufsbild mit einer zeitgemässen Haltung und Organisationsform zu entsprechen.
            - text: Ausserdem gehört zu pool auch ein breites kulturelles und gesellschaftliches Engagement, sei es in beratenden Gremien, Fachverbänden oder Architekturforen sowie als Einsitz in den Beurteilungsgremien von Architekturwettbewerben. Von 2010 bis 2012 hatte pool eine gemeinsame Gastprofessur an der ETH Zürich, weitere Engagements führten an die TU Berlin, TU Wien, BFH Bern oder die Universität Liechtenstein, an die ZHAW und die HSLU.
            - text: Ausserdem waren wir Mitbegründer der Architekturgruppe Krokodil, die mit verschiedenen Publikationen und Ausstellungen die Diskussion zur urbanen Entwicklung der Schweiz anregte, vor allem mit dem Manifest zur Entwicklung der Glatttalstadt. 2014 erhielten wir vom Bundesamt für Kultur den Grand Prix Kunst/Prix Meret Oppenheim.
